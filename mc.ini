# RetroPC for Midnight Commander (true-color skin).
# Based on zed.json: black panels, raised warm surfaces, amber-only accents.
# Requires MC with S-Lang true-color support and COLORTERM=truecolor or 24bit.

[skin]
    description = RetroPC — amber phosphor
    truecolors = true

[aliases]
    Background = #000000
    Surface = #0F0E0A
    Elevated = #1A1612
    Selection = #2A1F00
    Active = #392B00
    WriteHighlight = #4A3300
    Muted = #996600
    Dim = #805500
    Foreground = #FFB000
    Accent = #FFCC00
    Bright = #FFDD00
    Function = #FFBB00
    String = #FFAA00
    Type = #CC9900
    Hint = #FF9900
    Warning = #FF8800
    Error = #FF6600
    Success = #D4AA00

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = Foreground;Background
    selected = Accent;Selection
    marked = Bright;Background;bold
    markselect = Bright;Active;bold
    gauge = Background;Accent
    input = Foreground;Surface
    inputunchanged = Muted;Surface
    inputmark = Accent;WriteHighlight
    disabled = Dim;Elevated
    reverse = Accent;Elevated
    commandlinemark = Accent;Selection
    header = Accent;Background
    inputhistory = Type;Surface
    commandhistory = Type;Background
    shadow = Dim;Background

[dialog]
    _default_ = Foreground;Elevated
    dfocus = Accent;Active
    dhotnormal = Accent;Elevated;underline
    dhotfocus = Bright;Active;underline
    dtitle = Accent;Elevated;bold

[error]
    _default_ = Error;Elevated
    errdfocus = Background;Error
    errdhotnormal = Warning;Elevated;underline
    errdhotfocus = Background;Error;underline
    errdtitle = Error;Elevated;bold

[filehighlight]
    directory = Accent;Background;bold
    executable = Function;Background;bold
    symlink = Type;Background
    hardlink = String;Background
    stalelink = Error;Background;underline
    device = Hint;Background
    special = Warning;Background
    core = Error;Background;bold
    temp = Dim;Background
    archive = Warning;Background
    doc = String;Background
    source = Foreground;Background
    media = Success;Background
    graph = Type;Background
    database = Hint;Background

[menu]
    _default_ = Foreground;Surface
    entry = Foreground;Elevated
    menusel = Accent;Active
    menuhot = Accent;Surface;underline
    menuhotsel = Bright;Active;underline
    menuinactive = Muted;Surface

[popupmenu]
    _default_ = Foreground;Elevated
    menusel = Accent;Active
    menutitle = Accent;Elevated;bold

[buttonbar]
    hotkey = Accent;Background
    button = Foreground;Elevated

[statusbar]
    _default_ = Foreground;Elevated

[help]
    _default_ = Foreground;Elevated
    helpitalic = String;Elevated;italic
    helpbold = Accent;Elevated;bold
    helplink = Type;Elevated;underline
    helpslink = Bright;Active;underline
    helptitle = Accent;Elevated;bold

[editor]
    _default_ = Foreground;Background
    editbold = Accent;Background;bold
    editmarked = Foreground;Selection
    editwhitespace = Dim;Background
    editnonprintable = Dim;Background
    editlinestate = Dim;Background
    bookmark = Accent;Elevated
    bookmarkfound = Accent;WriteHighlight
    editrightmargin = Selection;Surface
    editbg = Foreground;Background
    editframe = Dim;Background
    editframeactive = Muted;Background
    editframedrag = Accent;Background

[viewer]
    _default_ = Foreground;Background
    viewbold = Accent;Background;bold
    viewunderline = String;Background;underline
    viewselected = Accent;Selection

[diffviewer]
    _default_ = Foreground;Background
    added = Success;Selection
    changedline = Accent;Elevated
    changednew = Accent;WriteHighlight;bold
    changed = Warning;Selection
    removed = Error;Elevated
    error = Error;Elevated;bold

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ×
